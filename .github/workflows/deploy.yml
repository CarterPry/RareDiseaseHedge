name: deploy

# Publish the site to Cloudflare Pages from the COMMITTED build outputs
# (pipeline/report/*, pipeline/ui/index.html, data/out/*). No data pipeline runs
# here — build_site.py just assembles _site/ from what's in the repo — so this is
# fast and deterministic. Fires when the built outputs change on main, or manually.
#
# Requires two repo secrets (Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   (scope: Account > Cloudflare Pages > Edit)
#   CLOUDFLARE_ACCOUNT_ID  (e4596a88dfcb23abba535ee140ae5ded)
# Without them the job FAILS (exit 1) — a silent skip hid a never-deployed CI for weeks.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/report/**"
      - "pipeline/ui/index.html"
      - "pipeline/data/out/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # A push made with GITHUB_TOKEN (the monthly refresh bot) never fires `push`
  # workflows, so the Sep + Oct 2026 refreshes were committed but never
  # published. workflow_run keys off the refresh job finishing instead.
  workflow_run:
    workflows: [refresh-data]
    types: [completed]

jobs:
  deploy:
    # a bare conclusion check would skip every human-push deploy
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assemble _site
        run: python pipeline/report/build_site.py
      - name: deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@latest pages deploy pipeline/report/_site --project-name=rarediseasehedge --branch=main --commit-dirty=true
      - name: fail if secrets missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN not set — built _site but did NOT deploy. Add the repo secret (Cloudflare Pages: Edit scope)."
          exit 1

name: deploy

# Publish the site to Cloudflare Pages from the COMMITTED build outputs
# (pipeline/report/*, pipeline/ui/index.html, data/out/*). No data pipeline runs
# here — build_site.py just assembles _site/ from what's in the repo — so this is
# fast and deterministic. Fires when the built outputs change on main, or manually.
#
# Requires two repo secrets (Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   (scope: Account > Cloudflare Pages > Edit)
#   CLOUDFLARE_ACCOUNT_ID  (e4596a88dfcb23abba535ee140ae5ded)
# Without them the deploy step is skipped, not failed.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/report/**"
      - "pipeline/ui/index.html"
      - "pipeline/data/out/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assemble _site
        run: python pipeline/report/build_site.py
      - name: deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@latest pages deploy pipeline/report/_site --project-name=rarediseasehedge --branch=main --commit-dirty=true
      - name: note if secrets missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN not set — built _site but did not deploy. Add repo secrets to enable auto-deploy."

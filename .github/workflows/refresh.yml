name: refresh-data

# Monthly heavy path: re-fetch every source, re-run the diff + enrichment, rebuild
# both front-ends, run the integrity check, and commit the updated outputs back to
# main. deploy.yml publishes afterwards via its `workflow_run` trigger (a bot
# push never fires `push` workflows). Also runnable on demand.
#
# Heavier and less deterministic than deploy.yml: it downloads ~120 MB of bulk
# data and runs the live GSRS relationship sweep for any new survivors (the GSRS
# cache IS committed since 2026-10-12, so only new moieties hit the API), so the first/monthly run can take 30-60 min and may hit
# a flaky regulator host — fetch.py keeps the previous good copy on any failure.
# The UNII index is fetched + extracted by fetch.py; if precision.fda.gov blocks
# the runner, drop the newest UNII_*.txt in manually and re-run.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

# Never let a manual dispatch overlap the scheduled run: both would push.
concurrency:
  group: rdh-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r pipeline/requirements.txt
      # raw/ is gitignored, so on a runner there is NO prior copy to fall back
      # on: a dead regulator host must fail the run (fetch.py exits 1), not
      # publish a shrunken candidate list with a green check.
      - name: fetch sources
        run: python pipeline/fetch.py
      - name: pipeline + enrich + build
        run: |
          python pipeline/rdh_diff.py
          python pipeline/enrich.py
          python pipeline/build_ui.py
          python pipeline/report/build_report_data.py
      - name: integrity check
        run: python pipeline/test_data_integrity.py
      - name: commit refreshed outputs
        run: |
          git config user.name  "rdh-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/data/out pipeline/data/cache pipeline/ui/index.html pipeline/report/data.js
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Monthly data refresh (automated)"
            # a human push during the ~45 min run would otherwise be a rejected
            # push swallowed by `|| echo`; outputs are generated, so take ours.
            git pull --rebase -X theirs origin main
            git push
          fi
